<!-- src/app/components/mapa-eventos/mapa-eventos.html -->
<div class="mapa-eventos-container">

  <div class="header">
    <div class="logo">
      <i class="fas fa-map-marked-alt"></i>
      <h1>Mapa Eventos</h1>
    </div>

    <div class="dropdown">
      <button class="btn-primary" (click)="menuVisible = !menuVisible">
        <i class="fas fa-bars"></i> Menú
      </button>
      <ul class="dropdown-menu" [class.show]="menuVisible">
        <li><a (click)="abrirModalLugares()"><i class="fas fa-location-dot"></i> Lugares</a></li>
        <li><a (click)="abrirModalTipos()"><i class="fas fa-tags"></i> Tipos de Eventos</a></li>
        <li><a (click)="abrirModalEventos()"><i class="fas fa-calendar-alt"></i> Lista de Eventos</a></li>
        <li><a (click)="abrirModalAsistentes()"><i class="fas fa-users"></i> Asistentes</a></li>
        <li><a (click)="abrirModalRegistroAsistentes()"><i class="fas fa-user-plus"></i> Registro Asistentes</a></li>
        <li><a (click)="abrirModalEstadisticas()"><i class="fas fa-chart-bar"></i> Estadísticas</a></li>
        <li><a (click)="abrirDashboard()"><i class="fas fa-chart-line"></i> Dashboard</a></li>
      </ul>
    </div>
  </div>

  <div *ngIf="loading" class="loading-indicator">
    <i class="fas fa-spinner fa-pulse"></i> Cargando eventos...
  </div>

 <!-- Filtros dinámicos -->
<div class="filtros" *ngIf="!loading">
  <!-- Botón "Todos" siempre presente -->
  <button (click)="filtrarEventos('todos')" 
          [class.active]="filtroActivo === 'todos'" 
          class="filter-btn">
    <i class="fas fa-globe-americas"></i> Todos
  </button>
  
  <!-- Botones dinámicos desde el backend -->
  <button *ngFor="let tipo of tiposFiltro" 
          (click)="filtrarEventos(tipo.valor)" 
          [class.active]="filtroActivo === tipo.valor" 
          class="filter-btn">
    <i [class]="iconosFiltros[tipo.valor] || 'fas fa-tag'"></i>
    {{ tipo.nombre }}
  </button>
</div>



  <div class="toggle-wrapper" *ngIf="!loading">
  <button (click)="toggleSeccionesElectorales()" class="toggle-section" 
          [class.active]="mostrarSeccionesElectorales">
    <i class="fas fa-map"></i>
    {{ mostrarSeccionesElectorales ? 'Ocultar' : 'Mostrar' }} Secciones Electorales
  </button>
</div>

  <div *ngIf="errorMessage" class="error-message">
    <i class="fas fa-exclamation-triangle"></i> {{ errorMessage }}
  </div>

  <div id="map"></div>
</div>
