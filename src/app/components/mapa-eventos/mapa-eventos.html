<div class="mapa-eventos-container">

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <i class="icon-location"></i>
      <h1>Eventos Culturales</h1>
    </div>
    <div class="dropdown">
      <button class="btn-primary dropdown-toggle" (click)="onMenuButtonClick($event)">
        <i class="icon-menu"></i> Menú
      </button>
      <ul class="dropdown-menu" [class.show]="menuVisible">
        <li><a (click)="abrirModalEventos()">Lista de Eventos</a></li>
        <li><a (click)="abrirModalAsistentes()">Asistentes</a></li>
        <li><a (click)="abrirModalEstadisticas()">Estadísticas</a></li>
      </ul>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filtros">
    <button (click)="filtrarEventos('todos')"
            [class.active]="filtroActivo === 'todos'"
            class="filter-btn">
      <i class="icon-all"></i> Todos
    </button>
    <button (click)="filtrarEventos('concierto')"
            [class.active]="filtroActivo === 'concierto'"
            class="filter-btn">
      <i class="icon-music"></i> Conciertos
    </button>
    <button (click)="filtrarEventos('teatro')"
            [class.active]="filtroActivo === 'teatro'"
            class="filter-btn">
      <i class="icon-theater"></i> Teatro
    </button>
    <button (click)="filtrarEventos('exposicion')"
            [class.active]="filtroActivo === 'exposicion'"
            class="filter-btn">
      <i class="icon-art"></i> Exposiciones
    </button>
    <button (click)="filtrarEventos('taller')"
            [class.active]="filtroActivo === 'taller'"
            class="filter-btn">
      <i class="icon-workshop"></i> Talleres
    </button>
    <button (click)="filtrarEventos('festival')"
            [class.active]="filtroActivo === 'festival'"
            class="filter-btn">
      <i class="icon-festival"></i> Festivales
    </button>
  </div>

  <!-- Botón zonas -->
  <button (click)="mostrarOcultarSecciones()" class="toggle-section">
    <i [class]="mostrarSecciones ? 'icon-eye-off' : 'icon-eye'"></i>
    {{ mostrarSecciones ? 'Ocultar' : 'Mostrar' }} Zonas
  </button>

  <!-- Mapa — los popups los maneja Leaflet directamente -->
  <div id="map"></div>

</div>
